# Local dev Postgres for Phase 0 dual-write / migration testing.
# NOT for production — password is dev-only.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: dast_scanner
      POSTGRES_USER: dast_admin
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dast_admin -d dast_scanner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
