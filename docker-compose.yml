version: "3.9"

services:
  dast-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dast-scanner
    restart: unless-stopped
    ports:
      - "${SCANNER_PORT:-80}:80"
    cap_add:
      - NET_BIND_SERVICE
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    env_file:
      - .env
    environment:
      - DUAL_WRITE_PG=${DUAL_WRITE_PG:-0}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      # Persist scan results across container restarts
      - scanner-results:/app/results
      - scanner-imports:/app/imports
      # Mount local code for live-reload during development (optional)
      # Uncomment the lines below for dev mode:
      # - ./web:/app/web
      # - ./scanners:/app/scanners
      # - ./scripts:/app/scripts
      # - ./config:/app/config
    shm_size: "2g"   # Playwright/Chromium needs adequate shared memory
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g

volumes:
  scanner-results:
  scanner-imports:
