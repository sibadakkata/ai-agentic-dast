name: Encoding check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: UTF-8 / null-byte gate
        run: python scripts/checks/check_no_null_bytes.py --all
