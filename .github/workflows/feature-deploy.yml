# Feature-branch CI: pytest, ECR runner image push, EC2 redeploy via deploy.sh
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   AWS_DEPLOY_ROLE_ARN  - IAM role ARN for OIDC (ECR push)
#   EC2_SSH_KEY          - PEM private key for ubuntu@3.20.180.251
name: feature-deploy
on:
  push:
    branches: [feature/scalable-scanner-platform]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q --ignore=tests/test_regression_ui.py --ignore=tests/test_api_imports.py --ignore=tests/test_tls_skip_flag.py
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          SHA=$(git rev-parse --short HEAD)
          docker build -f scanners/runner/Dockerfile -t dast-scanner-runner:$SHA scanners/runner/
          docker tag dast-scanner-runner:$SHA 168551359048.dkr.ecr.us-east-2.amazonaws.com/dast-scanner-runner:v0-$SHA
          docker tag dast-scanner-runner:$SHA 168551359048.dkr.ecr.us-east-2.amazonaws.com/dast-scanner-runner:latest
          docker push 168551359048.dkr.ecr.us-east-2.amazonaws.com/dast-scanner-runner:v0-$SHA
          docker push 168551359048.dkr.ecr.us-east-2.amazonaws.com/dast-scanner-runner:latest
  deploy-ui:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/dast-key
          chmod 600 ~/.ssh/dast-key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/dast-key ubuntu@3.20.180.251 "cd ~/ai-dast-scanner && bash deploy.sh"
