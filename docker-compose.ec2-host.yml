# EC2 production: host network, localhost-only uvicorn (TLS at host nginx + ALB).
# Usage: docker compose -f docker-compose.yml -f docker-compose.ec2-postgres.yml -f docker-compose.ec2-host.yml up -d
services:
  dast-scanner:
    network_mode: host
    ports: []
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: 12G
        reservations:
          memory: 1G
    environment:
      - DAST_COOKIE_SECURE=true
      - DAST_SESSION_SECRET=${DAST_SESSION_SECRET:-}
    command:
      - uvicorn
      - web.app:app
      - --host
      - "127.0.0.1"
      - --port
      - "8000"
